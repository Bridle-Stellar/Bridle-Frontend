name: Feature request
description: Suggest an improvement to the dashboard.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to do today, and for whom (owner, contributor, agent developer)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: dependencies
    attributes:
      label: Dependencies
      description: Does this need a change elsewhere first?
      options:
        - label: Needs a Bridle Backend change
        - label: Needs a Bridle Contract change
